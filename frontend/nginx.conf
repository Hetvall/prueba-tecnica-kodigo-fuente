server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy de la API y del health check hacia el backend dentro de la red de docker-compose.
    location /api/ {
        proxy_pass http://backend:4000/api/;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://backend:4000/health;
        proxy_set_header Host $host;
    }
}
